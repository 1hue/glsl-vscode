version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match engines.vscode
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Doc sources - docs.yml regenerates data/*.json on bumps
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    ignore:
      # npm package is the tracked copy
      - dependency-name: vendor/glslang-wasm
