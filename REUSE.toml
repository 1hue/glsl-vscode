version = 1
SPDX-PackageName = "glsl-vscode"
SPDX-PackageDownloadLocation = "https://github.com/1hue/glsl-vscode"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 1hue"
SPDX-License-Identifier = "MIT"

# Copied from https://github.com/stef-levesque/vscode-shader
# (commit f1c804839f9f58a6749c9a840187c5527b76b053), see LICENSE-vscode-shader.md
# Reformatted; syntaxes/glsl.tmLanguage also has an `#include` rule added.
[[annotations]]
path = [
  "language-configuration.json",
  "syntaxes/glsl.tmLanguage",
  "syntaxes/glsl-cpp.tmLanguage.json",
  "syntaxes/glsl-html.tmLanguage.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2015 Stef Levesque"
SPDX-License-Identifier = "MIT"

# Generated from the Khronos GLSL specification source, https://github.com/KhronosGroup/GLSL
# (commit in package.json config.glslSpec). Converted to JSON/Markdown, markup simplified.
[[annotations]]
path = ["data/glsl.json", "data/essl.json"]
precedence = "override"
SPDX-FileCopyrightText = "2008-2026 The Khronos Group Inc."
SPDX-License-Identifier = "CC-BY-4.0"

# Generated from the Godot documentation, https://github.com/godotengine/godot-docs
# (commit in package.json config.godotDocs). Converted to JSON/Markdown, markup simplified.
# Function descriptions are Godot's adaptation of the Khronos OpenGL reference pages (OPL v1.0).
[[annotations]]
path = "data/godot.json"
precedence = "override"
SPDX-FileCopyrightText = [
  "2014-present Juan Linietsky, Ariel Manzur and the Godot community",
  "2010-2014 Khronos Group",
]
SPDX-License-Identifier = "CC-BY-3.0 AND OPUBL-1.0"

# Built from https://github.com/KhronosGroup/glslang (tag and commit in glslang-wasm/scripts/compile.sh)
# with Emscripten (MIT OR NCSA, MIT chosen) and its musl libc (MIT)
[[annotations]]
path = ["glslang-wasm/dist/glslang.wasm", "glslang-wasm/dist/LICENSE.glslang.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2002-2026 The Khronos Group Inc. and glslang contributors",
  "2010-2026 Emscripten authors",
  "2005-2020 Rich Felker, et al.",
]
SPDX-License-Identifier = "LicenseRef-glslang AND MIT"

[[annotations]]
path = "glslang-wasm/dist/LICENSE.musl.txt"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# Emscripten output
[[annotations]]
path = ["glslang-wasm/dist/glslang.js", "glslang-wasm/dist/LICENSE.emscripten.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 Emscripten authors"
SPDX-License-Identifier = "MIT"
